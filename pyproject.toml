[project]
name = "swim-analytics"
version = "0.1.0"
description = "Swimming video analysis with pose overlays"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "rfdetr>=1.9",  # >= 1.9: COCO class names are in rfdetr.assets.coco_classes
    "trackers>=2.6",  # Roboflow: ByteTrack, OC-SORT, SORT (tracking stage)
]

[project.optional-dependencies]
app = ["fastapi", "uvicorn"]
dev = ["pytest", "httpx2", "websocket-client"]  # httpx2: FastAPI test client; websocket-client: drives Chrome
notebooks = ["jupyterlab", "matplotlib", "pandas"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["swim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["browser: drives headless Chrome (skipped without it); leave out with -m \"not browser\""]
